<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="editorialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="96" fill="url(#editorialBg)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#c59b27" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Monogram 'NC' (Editorial Bodoni / Cinzel Style) -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" font-family="'Bodoni Moda', 'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="280" fill="#fcfbf7" letter-spacing="-10">
    N<tspan fill="url(#accentGrad)">C</tspan>
  </text>

  <!-- Editorial Sub-line -->
  <circle cx="256" cy="420" r="12" fill="#c59b27" />
  <line x1="160" y1="420" x2="220" y2="420" stroke="#c59b27" stroke-width="4" stroke-linecap="round" />
  <line x1="292" y1="420" x2="352" y2="420" stroke="#c59b27" stroke-width="4" stroke-linecap="round" />
</svg>
