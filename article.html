<!DOCTYPE html>
<html lang="en-NG" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Dispatch — NAIJA CHRONICLES</title>
  <meta name="robots" content="index, follow" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            editorial: {
              crimson: '#b91c1c',
              gold: '#c59b27',
              ivory: '#fcfbf7',
              charcoal: '#121212',
              sand: '#f4f1ea'
            }
          }
        }
      }
    }
  </script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/editorial.css" />
</head>
<body class="min-h-screen flex flex-col bg-[var(--bg-primary)] selection:bg-red-900 selection:text-white">

  <!-- Reading Progress -->
  <div id="reading-progress"></div>

  <!-- Header -->
  <header class="border-b border-stone-200 dark:border-stone-800 bg-[var(--bg-primary)]">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-mono font-bold uppercase tracking-wider text-red-700 dark:text-red-400 hover:underline">
        ← Front Page
      </a>
      <a href="index.html" class="font-masthead text-lg sm:text-xl font-black text-stone-900 dark:text-stone-100">
        NAIJA CHRONICLES
      </a>
      <div class="flex items-center gap-2">
        <button onclick="setTheme('light')" class="px-2 py-0.5 rounded text-[10px] font-mono border border-stone-300 dark:border-stone-700">Ivory</button>
        <button onclick="setTheme('dark')" class="px-2 py-0.5 rounded text-[10px] font-mono border border-stone-300 dark:border-stone-700">Dark</button>
      </div>
    </div>
  </header>

  <!-- Article Body Container -->
  <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12 w-full">
    <div id="standalone-article-container">
      <div class="text-center py-16 text-stone-500 font-mono text-xs">
        Loading dispatch from Lagos Bureau...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-stone-200 dark:border-stone-800 bg-[var(--bg-secondary)] mt-auto py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between text-xs font-mono text-stone-500 gap-4">
      <div>© 2026 Naija Chronicles • Lagos Bureau</div>
      <div class="flex items-center gap-4">
        <a href="index.html" class="hover:underline">Front Page</a>
        <span>•</span>
        <a href="community.html" class="hover:underline">Community Wire</a>
        <span>•</span>
        <a href="archive.html" class="hover:underline">Archive</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script>
    let currentArticle = null;
    const theme = localStorage.getItem('the_chronicle_theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    function setTheme(t) {
      localStorage.setItem('the_chronicle_theme', t);
      document.documentElement.setAttribute('data-theme', t);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || params.get('article') || params.get('id') || window.location.hash.replace('#', '');
      
      let articles = [];
      const supabaseUrl = (window.CHRONICLE_CONFIG && window.CHRONICLE_CONFIG.supabaseUrl) || localStorage.getItem('chronicle_supabase_url');
      const supabaseKey = (window.CHRONICLE_CONFIG && window.CHRONICLE_CONFIG.supabaseAnonKey) || localStorage.getItem('chronicle_supabase_key');

      if (supabaseUrl && supabaseKey && window.supabase) {
        try {
          const client = window.supabase.createClient(supabaseUrl, supabaseKey);
          const { data, error } = await client.from('articles').select('*');
          if (!error && data) articles = data;
        } catch(e) {}
      }

      if (articles.length === 0) {
        try {
          const res = await fetch('assets/data/sample_articles.json?_v=' + Date.now());
          if (res.ok) articles = await res.json();
        } catch(e) {}
      }

      currentArticle = articles.find(a => a.slug === slug || a.id === slug) || articles[0];
      renderStandaloneArticle(currentArticle);
    });

    function renderStandaloneArticle(art) {
      const container = document.getElementById('standalone-article-container');
      if (!art || !container) return;

      document.title = art.title + ' — NAIJA CHRONICLES';
      const shareUrl = window.location.href;

      container.innerHTML = `
        <div class="mb-4 flex items-center gap-2 text-xs font-mono">
          <span class="px-2 py-0.5 font-bold uppercase bg-red-700 text-white">${art.tag || 'Dispatch'}</span>
          <span class="font-bold text-red-700 dark:text-red-400 uppercase">${art.category}</span>
          <span>•</span>
          <span class="text-stone-500">${art.read_time}</span>
        </div>

        <h1 class="font-display text-3xl sm:text-5xl font-bold leading-tight mb-4 text-stone-900 dark:text-stone-100">
          ${art.title}
        </h1>

        <p class="font-body-serif text-lg sm:text-xl text-stone-600 dark:text-stone-300 leading-relaxed mb-6 italic">
          ${art.dek}
        </p>

        <div class="flex items-center justify-between border-t border-b border-stone-200 dark:border-stone-800 py-3 my-6">
          <div class="flex items-center gap-3">
            <img src="${art.author_avatar || (art.author && art.author.avatar) || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'}" class="w-9 h-9 rounded-full object-cover" />
            <div>
              <div class="font-sans font-bold text-sm text-stone-900 dark:text-stone-100">${art.author_name || (art.author && art.author.name)}</div>
              <div class="font-sans text-xs text-stone-500">${art.author_role || (art.author && art.author.role)}</div>
            </div>
          </div>
        </div>

        <div class="image-editorial-frame aspect-[16/9] w-full rounded-sm mb-4 border border-stone-200 dark:border-stone-800">
          <img src="${art.cover_image}" alt="${art.title}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=1200&q=85';" />
        </div>
        ${art.image_caption ? `<p class="font-mono text-xs text-stone-500 mb-6 italic">${art.image_caption}</p>` : ''}

        <div class="article-rich-body drop-cap text-stone-800 dark:text-stone-200 my-8 text-base sm:text-lg">
          ${art.content}
        </div>

        <!-- Social Outreach Bar -->
        <div class="my-8 p-4 sm:p-5 bg-stone-100 dark:bg-stone-900 rounded border border-stone-200 dark:border-stone-800 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
          <span class="text-xs font-mono font-bold uppercase">Share This Dispatch:</span>
          <div class="flex items-center gap-2 flex-wrap">
            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(art.title + '\n\nRead on Naija Chronicles:\n' + shareUrl)}" target="_blank" class="px-3.5 py-1.5 rounded text-xs font-mono font-bold bg-emerald-600 text-white">WhatsApp</a>
            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(art.title)}&url=${encodeURIComponent(shareUrl)}" target="_blank" class="px-3.5 py-1.5 rounded text-xs font-mono font-bold bg-neutral-900 text-white dark:bg-stone-100 dark:text-neutral-900">Post on X</a>
            <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied!');" class="px-3.5 py-1.5 rounded text-xs font-mono border border-stone-300 dark:border-stone-700">Copy Link</button>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
